<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArrowRadar.geo — Метеорадар и Суперячейки LIVE</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    :root {
      --bg: #0b0f17;
      --panel: rgba(17, 24, 39, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warn: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Верхняя панель */
    .topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .brand { font-weight: 700; font-size: 15px; color: var(--accent); margin-right: 6px; white-space: nowrap; }
    .btn {
      background: rgba(255,255,255,0.07); color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .btn:hover, .btn.active { background: var(--accent); color: #000; font-weight: 600; }
    select.city-select {
      background: #1f2937; color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; font-size: 13px; outline: none; max-width: 190px;
    }

    /* Статус-бар внизу */
    .statusbar {
      position: fixed; bottom: 12px; left: 12px; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center;
    }

    /* Плавающие кнопки справа внизу */
    .fab-group { position: fixed; bottom: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; }
    .fab {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .fab:hover { border-color: var(--accent); }

    /* Модальные окна */
    .modal {
      position: fixed; bottom: 60px; right: 12px; width: 320px; max-width: calc(100vw - 24px);
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 14px; z-index: 1100;
      display: none; flex-direction: column; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .modal.open { display: flex; }
    .modal-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px;
    }
    .close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
    .modal-body { padding: 12px; font-size: 13px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { background: rgba(255,255,255,0.06); padding: 8px 10px; border-radius: 8px; line-height: 1.4; }
    .chat-msg.user { background: rgba(56, 189, 248, 0.2); align-self: flex-end; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 8px; }
    .chip { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.08); border: none; color: var(--text); cursor: pointer; }
    .modal-footer { display: flex; padding: 8px; border-top: 1px solid var(--border); gap: 6px; }
    .modal-footer input, .modal-body input, .modal-body textarea, .modal-body select {
      flex: 1; background: #1f2937; border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 8px; font-size: 13px; outline: none;
    }

    /* Панель разработчика */
    .dev-panel {
      position: fixed; top: 68px; right: 12px; width: 250px; z-index: 1050;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: none; flex-direction: column; gap: 8px; font-size: 13px;
    }
    .dev-panel.open { display: flex; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="brand">🛰 ArrowRadar.geo LIVE</span>
    <button class="btn" onclick="flyRegion(25, 15, 2)">🌍 Мир</button>
    <button class="btn" onclick="flyRegion(56, 45, 4)">🇷🇺 РФ</button>
    <button class="btn" onclick="flyRegion(42.1, 43.5, 7)">🇬🇪 Грузия</button>
    <button class="btn" onclick="flyRegion(38.5, -96, 4)">🇺🇸 США</button>

    <select id="citySelect" class="city-select" onchange="selectCity(this.value)">
      <option value="">🏙 Выбрать город...</option>
    </select>

    <button class="btn active" id="radarBtn" onclick="toggleRadar()">🌧 Осадки: ВКЛ</button>
    <button class="btn" onclick="locateMe()" title="Моё местоположение">📍</button>
    <button class="btn" onclick="toggleModal('devLoginModal')">⚙ Разработчик</button>
  </div>

  <div id="map"></div>

  <div class="statusbar">
    <span>🌪 Торнадо: <b id="cntTornado">0</b></span>
    <span>· 🌀 Суперячейки: <b id="cntSupercell">0</b></span>
    <span>· ⚠️ Опасные: <b id="cntDanger">0</b></span>
    <span style="color:var(--muted)">| Клик по спутнику = замер CAPE</span>
  </div>

  <div class="fab-group">
    <button class="fab" onclick="toggleModal('supportModal')">💬 Поддержка</button>
    <button class="fab" onclick="toggleModal('aiModal')">🤖 ИИ Помощник</button>
  </div>

  <!-- ИИ Помощник -->
  <div class="modal" id="aiModal">
    <div class="modal-header">
      <span>🤖 ArrowAI — Метео-аналитик</span>
      <button class="close-btn" onclick="toggleModal('aiModal')">✕</button>
    </div>
    <div class="modal-body" id="aiChat">
      <div class="chat-msg">Привет! Спросите про суперячейки, индекс CAPE или выберите любой город из списка выше.</div>
    </div>
    <div class="quick-chips">
      <button class="chip" onclick="askAI('Что такое CAPE?')">⚡ CAPE</button>
      <button class="chip" onclick="askAI('Признаки суперячейки')">🌀 Суперячейки</button>
      <button class="chip" onclick="askAI('Сводка по карте')">📊 Сводка</button>
    </div>
    <div class="modal-footer">
      <input type="text" id="aiInput" placeholder="Введите вопрос или город..." onkeydown="if(event.key==='Enter') sendAI()" />
      <button class="btn active" onclick="sendAI()">➤</button>
    </div>
  </div>

  <!-- Поддержка -->
  <div class="modal" id="supportModal">
    <div class="modal-header">
      <span>💬 Написать в поддержку</span>
      <button class="close-btn" onclick="toggleModal('supportModal')">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="supportText" rows="3" placeholder="Опишите проблему или предложение..."></textarea>
      <button class="btn active" onclick="sendSupport()">Отправить</button>
    </div>
  </div>

  <!-- Вход разработчика -->
  <div class="modal" id="devLoginModal">
    <div class="modal-header">
      <span>🔐 Вход разработчика</span>
      <button class="close-btn" onclick="toggleModal('devLoginModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="password" id="devPass" placeholder="Введите пароль (по умолч. admin)" />
      <button class="btn active" onclick="loginDev()">Войти</button>
    </div>
  </div>

  <!-- Панель разработчика -->
  <div class="dev-panel" id="devPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <b>🛠 Разработчик</b>
      <button class="btn" onclick="logoutDev()">Выйти</button>
    </div>
    <label>Тип зоны:</label>
    <select id="zoneType">
      <option value="tornado">🌪 Торнадо</option>
      <option value="supercell">🌀 Суперячейка</option>
      <option value="storm">⛈ Гроза</option>
    </select>
    <label>Цвет:</label>
    <div class="row">
      <button class="btn" onclick="setZoneColor('#3b82f6')">Синий</button>
      <button class="btn" onclick="setZoneColor('#eab308')">Жёлтый</button>
      <button class="btn" onclick="setZoneColor('#ef4444')">Красный</button>
    </div>
    <div class="row">
      <button class="btn" id="drawBtn" onclick="toggleDraw()">✏ Рисовать</button>
      <button class="btn" onclick="finishPolygon()">✔ Готово</button>
    </div>
    <button class="btn active" onclick="downloadJSON()">⬇ Скачать data.json</button>
  </div>

  <script src="https://unpkg.com"></script>
  <script>
    // 1. Расширенный список городов (РФ, Грузия, США, Мир)
    const CITIES = [
      { group: "🇷🇺 Россия", name: "Москва", lat: 55.7558, lon: 37.6173 },
      { group: "🇷🇺 Россия", name: "Санкт-Петербург", lat: 59.9343, lon: 30.3351 },
      { group: "🇷🇺 Россия", name: "Сочи", lat: 43.5855, lon: 39.7231 },
      { group: "🇷🇺 Россия", name: "Краснодар", lat: 45.0355, lon: 38.9753 },
      { group: "🇷🇺 Россия", name: "Ростов-на-Дону", lat: 47.2357, lon: 39.7015 },
      { group: "🇷🇺 Россия", name: "Казань", lat: 55.7961, lon: 49.1064 },
      { group: "🇷🇺 Россия", name: "Екатеринбург", lat: 56.8389, lon: 60.6057 },
      { group: "🇷🇺 Россия", name: "Новосибирск", lat: 55.0084, lon: 82.9357 },
      { group: "🇷🇺 Россия", name: "Владивосток", lat: 43.1155, lon: 131.8855 },
      { group: "🇷🇺 Россия", name: "Нижний Новгород", lat: 56.3269, lon: 44.0059 },
      { group: "🇷🇺 Россия", name: "Самара", lat: 53.1959, lon: 50.1002 },
      { group: "🇷🇺 Россия", name: "Воронеж", lat: 51.6608, lon: 39.2003 },
{ group: "🇷🇺 Россия", name: "Ставрополь", lat: 45.0445, lon: 41.9690 },
{ group: "🇷🇺 Россия", name: "Махачкала", lat: 42.9849, lon: 47.5047 },
{ group: "🇬🇪 Грузия", name: "Тбилиси", lat: 41.7151, lon: 44.8271 },
{ group: "🇬🇪 Грузия", name: "Батуми", lat: 41.6168, lon: 41.6367 },
{ group: "🇬🇪 Грузия", name: "Кутаиси", lat: 42.2679, lon: 42.6946 },
{ group: "🇬🇪 Грузия", name: "Рустави", lat: 41.5495, lon: 44.9932 },
{ group: "🇬🇪 Грузия", name: "Зугдиди", lat: 42.5088, lon: 41.8709 },
{ group: "🇬🇪 Грузия", name: "Телави", lat: 41.9198, lon: 45.4731 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Оклахома-Сити", lat: 35.4676, lon: -97.5164 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Даллас", lat: 32.7767, lon: -96.7970 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Канзас-Сити", lat: 39.0997, lon: -94.5786 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Омаха", lat: 41.2565, lon: -95.9345 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Уичито", lat: 37.6872, lon: -97.3301 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Нью-Йорк", lat: 40.7128, lon: -74.0060 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Майами", lat: 25.7617, lon: -80.1918 },
{ group: "🇺🇸 США (Аллея торнадо)", name: "Чикаго", lat: 41.8781, lon: -87.6298 },
{ group: "🌍 Мир", name: "Лондон", lat: 51.5074, lon: -0.1278 },
{ group: "🌍 Мир", name: "Берлин", lat: 52.5200, lon: 13.4050 },
{ group: "🌍 Мир", name: "Стамбул", lat: 41.0082, lon: 28.9784 },
{ group: "🌍 Мир", name: "Алматы", lat: 43.2220, lon: 76.8512 },
{ group: "🌍 Мир", name: "Минск", lat: 53.9045, lon: 27.5615 },
{ group: "🌍 Мир", name: "Ереван", lat: 40.1792, lon: 44.4991 },
{ group: "🌍 Мир", name: "Баку", lat: 40.4093, lon: 49.8671 },
{ group: "🌍 Мир", name: "Токио", lat: 35.6762, lon: 139.6503 }
];
// Заполнение выпадающего списка городов
const citySelect = document.getElementById('citySelect');
const groups = {};
CITIES.forEach((c, idx) => {
if (!groups[c.group]) {
groups[c.group] = document.createElement('optgroup');
groups[c.group].label = c.group;
citySelect.appendChild(groups[c.group]);
}
const opt = document.createElement('option');
opt.value = idx;
opt.textContent = c.name;
groups[c.group].appendChild(opt);
});
// 2. Инициализация ТОЛЬКО спутниковой карты
const map = L.map('map', { zoomControl: false }).setView([45.0, 42.0], 5);
L.control.zoom({ position: 'bottomleft' }).addTo(map);
// Спутниковая подложка Esri World Imagery
L.tileLayer('arcgisonline.com{z}/{y}/{x}', {
maxZoom: 18,
attribution: 'Esri Satellite'
}).addTo(map);
// Слой подписей границ и городов поверх спутника для ориентирования
L.tileLayer('arcgisonline.com{z}/{y}/{x}', {
maxZoom: 18,
opacity: 0.85
}).addTo(map);
// 3. Слой осадков RainViewer LIVE
let radarLayer = null;
let radarActive = true;
async function loadRadar() {
try {
const res = await fetch('rainviewer.com');
const data = await res.json();
const past = data.radar.past;
const latest = past[past.length - 1].path;
radarLayer = L.tileLayer(https://rainviewer.com${latest}/256/{z}/{x}/{y}/2/1_1.png, {
opacity: 0.65,
zIndex: 500
}).addTo(map);
} catch (e) {
console.warn('Не удалось загрузить радар осадков:', e);
}
}
loadRadar();
function toggleRadar() {
if (!radarLayer) return;
radarActive = !radarActive;
const btn = document.getElementById('radarBtn');
if (radarActive) {
radarLayer.addTo(map);
btn.classList.add('active');
btn.textContent = '🌧 Осадки: ВКЛ';
} else {
map.removeLayer(radarLayer);
btn.classList.remove('active');
btn.textContent = '🌧 Осадки: ВЫКЛ';
}
}
// 4. Навигация и замер CAPE через Open-Meteo
function flyRegion(lat, lon, zoom) {
map.flyTo([lat, lon], zoom, { duration: 1.2 });
}
function selectCity(idx) {
if (idx === "") return;
const city = CITIES[idx];
map.flyTo([city.lat, city.lon], 10, { duration: 1.4 });
measurePoint(city.lat, city.lon, city.name);
}
function locateMe() {
if (!navigator.geolocation) return alert('Геолокация не поддерживается');
navigator.geolocation.getCurrentPosition(pos => {
const { latitude, longitude } = pos.coords;
map.flyTo([latitude, longitude], 10);
measurePoint(latitude, longitude, 'Ваша геопозиция');
});
}
async function measurePoint(lat, lon, title = 'Точка замера') {
const popup = L.popup()
.setLatLng([lat, lon])
.setContent(<b>${title}</b><br>Загрузка метеоданных и CAPE...)
.openOn(map);
try {
const url = https://open-meteo.com{lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,wind_speed_10m,weather_code&hourly=cape&forecast_days=1;
const res = await fetch(url);
const data = await res.json();
const temp = data.current.temperature_2m;
const wind = data.current.wind_speed_10m;
const hourIdx = new Date().getHours();
const cape = data.hourly.cape[hourIdx] ?? 0;
let risk = '🟢 Спокойно';
if (cape >= 2500) risk = '🔴 Высокий риск суперячеек';
else if (cape >= 1000) risk = '🟡 Умеренная конвекция';
popup.setContent(<div style="color:#111;font-size:13px;line-height:1.5;"> <b>📍 ${title}</b> (${lat.toFixed(2)}, ${lon.toFixed(2)})<br> 🌡 Температура: <b>${temp} °C</b><br> 💨 Ветер: <b>${wind} км/ч</b><br> ⚡ Индекс CAPE: <b>${cape} Дж/кг</b><br> 📊 Статус: <b>${risk}</b> </div>);
} catch (err) {
popup.setContent(<b>${title}</b><br>Ошибка получения данных CAPE.);
}
}
map.on('click', e => {
if (isDrawing) {
currentPoints.push([e.latlng.lat, e.latlng.lng]);
if (tempPoly) map.removeLayer(tempPoly);
tempPoly = L.polygon(currentPoints, { color: zoneColor }).addTo(map);
return;
}
measurePoint(e.latlng.lat, e.latlng.lng);
});
// 5. ИИ Помощник и модальные окна
function toggleModal(id) {
const el = document.getElementById(id);
const isOpen = el.classList.contains('open');
document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
if (!isOpen) el.classList.add('open');
}
function appendChat(text, isUser = false) {
const box = document.getElementById('aiChat');
const div = document.createElement('div');
div.className = 'chat-msg' + (isUser ? ' user' : '');
div.textContent = text;
box.appendChild(div);
box.scrollTop = box.scrollHeight;
}
function askAI(q) {
appendChat(q, true);
setTimeout(() => {
const low = q.toLowerCase();
const foundCity = CITIES.find(c => low.includes(c.name.toLowerCase()));
if (foundCity) {
map.flyTo([foundCity.lat, foundCity.lon], 10);
measurePoint(foundCity.lat, foundCity.lon, foundCity.name);
appendChat(Перемещаю спутник на город ${foundCity.name} и замеряю CAPE.);
} else if (low.includes('cape')) {
appendChat('CAPE — конвективная доступная потенциальная энергия (Дж/кг). Значения выше 1500–2500 Дж/кг указывают на высокий риск сильных гроз и суперячеек.');
} else if (low.includes('суперячейк')) {
appendChat('Суперячейка — мощная гроза с вращающимся восходящим потоком (мезоциклоном), способная вызывать крупный град, шквалы и торнадо.');
} else {
appendChat(Активных зон на карте: Торнадо — ${zones.filter(z=>z.type==='tornado').length}, Суперячеек — ${zones.filter(z=>z.type==='supercell').length}. Кликните по любой точке спутника для замера.);
}
}, 250);
}
function sendAI() {
const inp = document.getElementById('aiInput');
if (!inp.value.trim()) return;
askAI(inp.value.trim());
inp.value = '';
}
function sendSupport() {
const txt = document.getElementById('supportText');
if (!txt.value.trim()) return;
alert('Сообщение отправлено команде ArrowRadar.geo!');
txt.value = '';
toggleModal('supportModal');
}
// 6. Инструменты разработчика (рисование зон и экспорт data.json)
let isDrawing = false;
let zoneColor = '#ef4444';
let currentPoints = [];
let tempPoly = null;
let zones = [];
function loginDev() {
const pass = document.getElementById('devPass').value;
if (pass === 'admin' || pass.length >= 4) {
toggleModal('devLoginModal');
document.getElementById('devPanel').classList.add('open');
} else {
alert('Неверный пароль (по умолчанию: admin)');
}
}
function logoutDev() {
document.getElementById('devPanel').classList.remove('open');
isDrawing = false;
}
function setZoneColor(c) { zoneColor = c; }
function toggleDraw() {
isDrawing = !isDrawing;
const btn = document.getElementById('drawBtn');
btn.classList.toggle('active', isDrawing);
btn.textContent = isDrawing ? '✏ Кликайте по карте...' : '✏ Рисовать';
}
function finishPolygon() {
if (currentPoints.length < 3) return alert('Поставьте минимум 3 точки на карте');
const type = document.getElementById('zoneType').value;
zones.push({ type, color: zoneColor, coordinates: currentPoints });
currentPoints = [];
tempPoly = null;
isDrawing = false;
document.getElementById('drawBtn').classList.remove('active');
document.getElementById('drawBtn').textContent = '✏ Рисовать';
updateCounters();
}
function updateCounters() {
document.getElementById('cntTornado').textContent = zones.filter(z => z.type === 'tornado').length;
document.getElementById('cntSupercell').textContent = zones.filter(z => z.type === 'supercell').length;
document.getElementById('cntDanger').textContent = zones.filter(z => z.color === '#ef4444').length;
}
function downloadJSON() {
const blob = new Blob([JSON.stringify(zones, null, 2)], { type: 'application/json' });
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'data.json';
a.click();
}
